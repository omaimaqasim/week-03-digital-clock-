<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Digital Clock</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="css/style.css">

  <!-- Huge Icons -->
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-solid-rounded.css" />
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
</head>

<body>
  <div class="nav">
    <h1> ⏰Digital Clock</h1>
    <div class="darkMode">
      <i class="hgi hgi-stroke hgi-moon-02"></i> <!-- 🌙 starts in light mode -->
    </div>
  </div>

  <div class="digital_clock">
    <div id="time_box">--:--:--</div>
    <div id="date_box" class="date_box">Loading Date...</div>
    <div class="greeting"></div>
  </div>

  <script src="script/script.js"></script>
</body>
</html>

  
  <!-- 📌 IMPORTANT POINTS TO REMEMBER:
    1. new Date() → creates a date object with current date and time.
    2. getHours(), getMinutes(), getSeconds() → get respective parts of time.
    3. toString().padStart(2, '0') → ensures always two digits (like 09, 04).
    4. getDate(), getMonth(), getFullYear() → get parts of the date.
    5. setInterval(function, 1000) → calls a function every 1000ms (1 second) to keep updating the time.
  -->
