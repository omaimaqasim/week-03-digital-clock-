<!-- 📌 IMPORTANT POINTS TO REMEMBER:
    1. new Date() → creates a date object with current date and time.
    2. getHours(), getMinutes(), getSeconds() → get respective parts of time.
    3. toString().padStart(2, '0') → ensures always two digits (like 09, 04).
    4. getDate(), getMonth(), getFullYear() → get parts of the date.
    5. setInterval(function, 1000) → calls a function every 1000ms (1 second) to keep updating the time.
  -->
